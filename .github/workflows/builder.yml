name: SafeGamingOS Builder

on:
  workflow_dispatch:

jobs:
  build-base:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install archiso and sync databases
        run: |
          pacman -Sy --noconfirm archiso base-devel git

      - name: Download packages to cache
        run: |
          grep -v '^#' packages.x86_64 | grep -v '^$' | sed 's/\r$//' > /tmp/pkglist.txt
          pacman -Syw --noconfirm --cachedir /var/cache/pacman/pkg/ $(cat /tmp/pkglist.txt)

      - name: Build airootfs (only)
        run: |
          set -e
          mkdir -p /tmp/work
          cp -a archiso /tmp/work/profile
          cd /tmp/work
          
          mkdir -p airootfs
          
          # Ключевой фикс: у pacstrap НЕТ --noconfirm.
          # Передаём его в pacman через переменную окружения PACMAN.
          # Также убираем -i (интерактивный режим), чтобы не ждал ввода.
          export PACMAN="pacman --noconfirm --needed"
          
          pacstrap -C profile/pacman.conf -c -G airootfs $(cat /tmp/pkglist.txt)
          
          # Копируем твои файлы поверх установленной системы
          cp -a profile/airootfs/* airootfs/ 2>/dev/null || true
          
          if [ -f airootfs/root/customize_airootfs.sh ]; then
            chroot airootfs /bin/bash /root/customize_airootfs.sh || true
          fi

      - name: Upload airootfs
        uses: actions/upload-artifact@v4
        with:
          name: airootfs
          path: /tmp/work/airootfs
          retention-days: 7

      - name: Upload package cache
        uses: actions/upload-artifact@v4
        with:
          name: package-cache
          path: /var/cache/pacman/pkg/
          retention-days: 7
